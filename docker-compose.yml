version: '3.8'

services:
  # ==========================================
  # MySQL Database Service
  # ==========================================
  my-db:
    image: mysql:8.0
    restart: always # Automatically restarts the container if it crashes or the system reboots
    
    # Environment variables securely injected from your local .env file
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      
    # Maps port 3306 inside the container to port 3306 on your host machine
    ports:
      - "3306:3306"